name: Verify Userscript Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Story and post behavior
        run: npm test
      - name: Build install and update files
        run: npm run build
      - name: Verify script syntax and committed release files
        run: |
          node --check main.js
          node --check ig-helper.user.js
          cmp main.js ig-helper.user.js
          git diff --exit-code -- main.js ig-helper.user.js ig-helper.meta.js
